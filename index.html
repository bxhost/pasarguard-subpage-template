<head>

<!-- Bootstrap 5.3 (LTR / RTL swapped at runtime by language) -->
<link id="bs-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<style>
/* ---- Minimal custom layer on top of Bootstrap. No other CSS framework is used. ---- */
:root{
  --brand-primary:#8ec971;
  --brand-accent:#8ec971;
  --brand-cyan:#8ec971;
  --bs-success:#8ec971;
  --bs-success-rgb:142,201,113;
}
[data-bs-theme="dark"]{
  --bs-body-bg:#070b22;
  --bs-body-bg-rgb:7,11,34;
  --bs-tertiary-bg:#0a1030;
  --bs-success:#8ec971;
  --bs-success-rgb:142,201,113;
}
[data-bs-theme="dark"] body{
  background:
    radial-gradient(circle at 12% 8%, rgba(142,201,113,.16), transparent 32rem),
    radial-gradient(circle at 88% 19%, rgba(90,158,75,.11), transparent 28rem),
    radial-gradient(circle at 50% 86%, rgba(184,230,160,.09), transparent 32rem),
    var(--bs-body-bg);
}
.btn-outline-success {
    --bs-btn-color: #8ec971;
    --bs-btn-border-color: #8ec971;
    --bs-btn-hover-color: #fff;
    --bs-btn-hover-bg: #8ec971;
    --bs-btn-hover-border-color: #8ec971;
    --bs-btn-focus-shadow-rgb: 25, 135, 84;
    --bs-btn-active-color: #fff;
    --bs-btn-active-bg: #8ec971;
    --bs-btn-active-border-color: #8ec971;
    --bs-btn-active-shadow: inset 0 3px 5px rgba(0, 0, 0, 0.125);
    --bs-btn-disabled-color: #8ec971;
    --bs-btn-disabled-bg: transparent;
    --bs-btn-disabled-border-color: #8ec971;
    --bs-gradient: none;
}
body{ padding-bottom:5.5rem; min-height:100vh; }
.text-success{ color:var(--brand-accent) !important; }
.text-cyan{ color:var(--brand-cyan) !important; }
.bg-accent-soft{ background:rgba(90,158,75,.12); }
.bg-cyan-soft{ background:rgba(184,230,160,.10); }
.avatar-circle{
  width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--brand-cyan),var(--brand-accent));
  color:#fff;font-weight:700;font-size:1.1rem;overflow:hidden;flex:0 0 auto;position:relative;
}
.avatar-circle img{width:100%;height:100%;object-fit:cover;}
.online-dot{position:absolute;width:11px;height:11px;border-radius:50%;background:#23da74;border:2px solid var(--bs-body-bg);inset-inline-end:0;bottom:0;}
.flag-circle{width:42px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto;font-size:1.1rem;position:relative;}
.flag-circle img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.flag-circle span{position:relative;color:#182044;font-weight:700;font-size:.65rem;}
.server-card{transition:.2s ease;}
.server-card:hover{transform:translateY(-2px);}
.server-card.recommended{border-color:var(--brand-accent) !important;box-shadow:0 0 0 1px var(--brand-accent) inset;}
.chart-wrap{height:230px;}
.chart-svg{width:100%;height:100%;}
.chart-grid-line{stroke:var(--bs-border-color);stroke-width:1;}
.chart-area{fill:url(#trafficGradient);}
.chart-line{fill:none;stroke:url(#lineGradient);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
.chart-dot{fill:var(--brand-accent);stroke:var(--bs-body-bg);stroke-width:2;}
.chart-label{fill:var(--bs-secondary-color);font-size:10px;}
.fav-btn.active{color:#ffbd5b !important;}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:1030;}
.bottom-nav .nav-link{color:var(--bs-secondary-color);text-align:center;font-size:.72rem;padding:.5rem .25rem;}
.bottom-nav .nav-link.active{color:#fff;background:linear-gradient(135deg,var(--brand-accent),#ffc107);border-radius:.5rem;}
.bottom-nav svg{display:block;margin:0 auto 2px;}
.action-card{min-height:100px;}
.masked-host{direction:ltr;unicode-bidi:isolate;}
.progress{height:.6rem;}
.qr-box{background:#fff;border-radius:.5rem;padding:14px;display:flex;align-items:center;justify-content:center;min-height:260px;}
.qr-box svg{width:min(100%,300px);height:auto;}
.spin{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loader-spinner{width:3rem;height:3rem;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}

/* Success overrides – all Bootstrap success utilities now use #8ec971 */
.bg-success{background-color:var(--bs-success)!important;}
.text-success{color:var(--bs-success)!important;}
.btn-success{--bs-btn-bg:var(--bs-success);--bs-btn-border-color:var(--bs-success);--bs-btn-hover-bg:#7ab85f;--bs-btn-hover-border-color:#6ea854;--bs-btn-active-bg:#6ea854;}
.text-bg-success{color:#fff!important;background-color:var(--bs-success)!important;}
.badge.text-bg-success{background-color:var(--bs-success)!important;}
.progress-bar.bg-success{background-color:var(--bs-success)!important;}
</style>

<!-- Installer configuration -->
<script>
(() => {
  const encodedConfig = "e30=";
  let installedConfig = {};
  try {
    const binary = atob(encodedConfig);
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    installedConfig = JSON.parse(new TextDecoder().decode(bytes));
  } catch {}
  window.NEON_THEME_CONFIG = Object.assign({
    brandName: "BXN",
    brandSubtitle: "Выделенная сеть на территории РФ",
    logoUrl: "",
    avatarUrl: "",
    primary: "#8ec971",
    primary2: "#8ec971",
    cyan: "#20d8ff",
    defaultLanguage: "ru",
    supportedLanguages: ["ru"],
    defaultTheme: "light",
    panelDomain: "",
    supportUrl: "https://t.me/+laij7m-ITHphZGUy",
    flagCdnBase: "https://flagcdn.com/w80",
    templateUrl: "https://github.com/bxhost/pasarguard-subpage-template",
    showMaskedHost: true,
    refreshIntervalMs: 30000
  }, installedConfig);
})();
</script>

<!-- Server-rendered subscription data (Jinja2) — unchanged integration contract -->
<script>
try {
  const obj = {
    user: {% if user %}{% set user_data = {
      'id': user.id,
      'username': user.username,
      'status': user.status.name if user.status else 'active',
      'used_traffic': user.used_traffic,
      'lifetime_used_traffic': user.lifetime_used_traffic,
      'data_limit': user.data_limit,
      'data_limit_reset_strategy': user.data_limit_reset_strategy.name if user.data_limit_reset_strategy else 'no_reset',
      'expire': user.expire.isoformat() if user.expire else None,
      'on_hold_expire_duration': user.on_hold_expire_duration,
      'on_hold_timeout': user.on_hold_timeout.isoformat() if user.on_hold_timeout else None,
      'group_ids': user.group_ids,
      'created_at': user.created_at.isoformat() if user.created_at else None,
      'edit_at': user.edit_at.isoformat() if user.edit_at else None,
      'online_at': user.online_at.isoformat() if user.online_at else None,
      'proxy_settings': {
        'vmess': {'id': user.proxy_settings.vmess.id|string} if user.proxy_settings.vmess else None,
        'vless': {'id': user.proxy_settings.vless.id|string, 'flow': user.proxy_settings.vless.flow.name if user.proxy_settings.vless.flow else None} if user.proxy_settings.vless else None,
        'trojan': {'password': user.proxy_settings.trojan.password} if user.proxy_settings.trojan else None,
        'shadowsocks': {'password': user.proxy_settings.shadowsocks.password, 'method': user.proxy_settings.shadowsocks.method.name if user.proxy_settings.shadowsocks.method else None} if user.proxy_settings.shadowsocks else None,
        'wireguard': {'public_key': user.proxy_settings.wireguard.public_key, 'peer_ips': user.proxy_settings.wireguard.peer_ips} if user.proxy_settings.wireguard else None,
        'hysteria': {'auth': user.proxy_settings.hysteria.auth|string} if user.proxy_settings.hysteria else None
      },
      'next_plan': {
        'user_template_id': user.next_plan.user_template_id,
        'data_limit': user.next_plan.data_limit,
        'expire': user.next_plan.expire,
        'add_remaining_traffic': user.next_plan.add_remaining_traffic
      } if user.next_plan else None
    } %}{{ user_data | tojson | safe }}{% else %}null{% endif %},
    links: {{ links | tojson | safe }},
    apps: {% if apps %}{% set apps_data = [] %}{% for item in apps %}{% if item %}{% set download_links_data = [] %}{% for download_link in item.download_links %}{% if download_link %}{% set link_dict = {
      'name': download_link.name,
      'url': download_link.url,
      'language': download_link.language
    } %}{% set _ = download_links_data.append(link_dict) %}{% endif %}{% endfor %}{% set app_dict = {
      'name': item.name,
      'icon_url': item.icon_url,
      'import_url': item.import_url,
      'description': item.description,
      'recommended': item.recommended,
      'platform': item.platform,
      'download_links': download_links_data
    } %}{% set _ = apps_data.append(app_dict) %}{% endif %}{% endfor %}{{ apps_data | tojson | safe }}{% else %}null{% endif %}
  };
  window.__INITIAL_DATA__ = obj;
} catch (error) {
  console.warn("Failed to load initial subscription data:", error);
  window.__INITIAL_DATA__ = {};
}
</script>

<!-- QR code generator (required for the QR-code feature; algorithmic dependency, not a styling/UI library) -->
<script>
var qrcode = function() {

  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';

  function chartData(){ return state.usage.map(x=>({date:x.period_start||x.timestamp||x.date||'', value:Number(x.total_traffic??x.traffic??x.value??0)})).filter(x=>x.date && Number.isFinite(x.value)); }
  function chartSvgHtml(){
    const data=chartData();
    if(state.usageLoading) return `<div class="text-center py-5"><div class="spinner-border text-accent" role="status"></div><div class="mt-2 text-secondary">${t('loading')}</div></div>`;
    if(!data.length) return `<div class="text-center text-secondary py-5">${t('noUsage')}</div>`;
    const w=1000,h=220,padL=25,padR=20,padT=18,padB=32,max=Math.max(...data.map(x=>x.value),1);
    const pts=data.map((d,i)=>({x:padL+(w-padL-padR)*(data.length===1?.5:i/(data.length-1)),y:padT+(h-padT-padB)*(1-d.value/max),...d}));
    const line=pts.map((p,i)=>(i?'L':'M')+' '+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
    const area='M '+pts[0].x+' '+(h-padB)+' '+pts.map(p=>'L '+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ')+' L '+pts[pts.length-1].x+' '+(h-padB)+' Z';
    const labels=pts.filter((_,i)=>i===0||i===pts.length-1||i%Math.ceil(pts.length/5)===0);
    return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${t('usageChart')}">
      <defs><linearGradient id="trafficGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${CONFIG.primary2}" stop-opacity=".35"/><stop offset="1" stop-color="${CONFIG.cyan}" stop-opacity="0"/></linearGradient>
      <linearGradient id="lineGradient" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${CONFIG.primary2}"/><stop offset="1" stop-color="${CONFIG.cyan}"/></linearGradient></defs>
      ${[0,.25,.5,.75,1].map(r=>`<line class="chart-grid-line" x1="${padL}" x2="${w-padR}" y1="${padT+(h-padT-padB)*r}" y2="${padT+(h-padT-padB)*r}"/>`).join('')}
      <path class="chart-area" d="${area}"/><path class="chart-line" d="${line}"/>
      ${pts.map(p=>`<circle class="chart-dot" cx="${p.x}" cy="${p.y}" r="4"><title>${escapeHtml(formatDate(p.date,true))}: ${escapeHtml(formatBytes(p.value))}</title></circle>`).join('')}
      ${labels.map(p=>`<text class="chart-label" x="${p.x}" y="${h-8}" text-anchor="middle">${escapeHtml(formatDate(p.date).slice(0,10))}</text>`).join('')}
    </svg>`;
  }
  function chartHtml(){
    const total=chartData().reduce((a,b)=>a+b.value,0); const ranges=['1h','12h','24h','7d','30d','90d'];
    return `<section id="usage" class="card shadow-sm mb-3"><div class="card-body">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
        <div><div class="fw-bold d-flex align-items-center gap-2">${icon('chart',20,'text-accent')} ${t('usageChart')}</div><div class="small text-secondary">${t('chartTotal')}: <b class="masked-host">${formatBytes(total)}</b></div></div>
        <ul class="nav nav-pills flex-nowrap overflow-auto">${ranges.map(r=>`<li class="nav-item"><button class="nav-link ${state.timeRange===r?'active':''}" data-range="${r}">${t('range'+r)}</button></li>`).join('')}</ul>
      </div>
      <div id="chart-wrap" class="chart-wrap">${chartSvgHtml()}</div>
    </div></section>`;
  }

  function platformInfo(){ const ua=navigator.userAgent.toLowerCase(); if(/iphone|ipad|ipod/.test(ua)) return 'ios'; if(/android/.test(ua)) return 'android'; if(/win/.test(ua)) return 'windows'; if(/mac/.test(ua)) return 'macos'; if(/linux/.test(ua)) return 'linux'; return 'other'; }

    const desc=(app.description && typeof app.description==='object' ? (app.description[state.lang]||app.description.en) : app.description) || '';

    const localized=links.filter(x=>x.language===state.lang), fallback=links.filter(x=>x.language==='en'), show=localized.length?localized:(fallback.length?fallback:links);
    const img=safeUrl(app.icon_url);
    return `<div class="col"><div class="card h-100"><div class="card-body">
      <div class="d-flex align-items-center gap-2 mb-2">${img?`<img class="rounded-2" width="36" height="36" src="${escapeHtml(img)}" alt="">`:`<span class="d-inline-flex align-items-center justify-content-center rounded-2 bg-accent-soft text-accent" style="width:36px;height:36px">${platformIcon(p)}</span>`}
        <div class="min-w-0"><div class="fw-semibold text-truncate">${escapeHtml(app.name)}</div>${app.recommended?`<span class="badge text-bg-success">${t('recommendedApp')}</span>`:''}</div>
      </div>
      <p class="small text-secondary">${escapeHtml(desc)}</p>
      <div class="d-flex flex-wrap gap-2">${show.map(x=>{const u=safeUrl(x.url);return u?`<a class="btn btn-sm btn-outline-secondary" href="${escapeHtml(u)}" target="_blank" rel="noopener">${icon('download',13)} ${escapeHtml(x.name||t('download'))}</a>`:'';}).join('')}${safeExternalUrl(app.import_url)?`<a class="btn btn-sm btn-primary" href="${escapeHtml(safeExternalUrl(app.import_url))}" target="_blank" rel="noopener">${icon('link',13)} ${t('import')}</a>`:''}</div>
    </div></div></div>`;
  }
  function appsHtml(){

    const items=[['dashboard','apps'],['servers','server'],['apps','download']];

    if(!state.user){ root.innerHTML=`<div class="container py-5"><div class="card shadow-sm mx-auto" style="max-width:520px"><div class="card-body text-center"><h2 class="h4">${t('error')}</h2><p class="text-secondary">${escapeHtml(state.error?.message||t('invalidData'))}</p><button class="btn btn-primary" id="retry-btn">${t('retry')}</button></div></div></div>`; bind(); return; }

  function renderToolbarOnly(){ const old=document.querySelector('header'); if(old) old.outerHTML=topbarHtml(); bindToolbar(); }
  function renderServersOnly(){ const old=document.getElementById('servers'); if(old) old.outerHTML=serversHtml(); bindServers(); }
  function renderChartOnly(){ const old=document.getElementById('usage'); if(old) old.outerHTML=chartHtml(); bindChart(); }

  function cycleLanguage(){ if(supportedLangs.length<2) return; const i=supportedLangs.indexOf(state.lang); state.lang=supportedLangs[(i+1)%supportedLangs.length]; local.set('neon-lang',state.lang); render(); }

  function bindToolbar(){
    document.getElementById('lang-toggle')?.addEventListener('click', cycleLanguage);
    document.getElementById('theme-toggle')?.addEventListener('click', () => { state.theme = state.theme==='dark' ? 'light' : 'dark'; local.set('neon-theme', state.theme); render(); });
    document.getElementById('refresh-btn')?.addEventListener('click', () => { fetchInfo(); fetchUsage(); });
  }
  function bindFlagImages(){ document.querySelectorAll('.flag-circle img').forEach(img => img.addEventListener('error', () => img.remove(), { once:true })); }
  function bindServers(){
    document.getElementById('serversBody')?.addEventListener('shown.bs.collapse', () => { state.serversOpen=true; local.set('neon-servers-open','1'); });
    document.getElementById('serversBody')?.addEventListener('hidden.bs.collapse', () => { state.serversOpen=false; local.set('neon-servers-open','0'); });
    document.getElementById('server-search')?.addEventListener('input', e => { state.search=e.target.value; renderServersOnly(); requestAnimationFrame(() => { const el=document.getElementById('server-search'); el?.focus(); el?.setSelectionRange(state.search.length,state.search.length); }); });
    document.getElementById('protocol-filter')?.addEventListener('change', e => { state.protocol=e.target.value; renderServersOnly(); });
    document.getElementById('sort-filter')?.addEventListener('change', e => { state.sort=e.target.value; renderServersOnly(); });
    document.getElementById('server-list')?.addEventListener('click', e => {
      const b=e.target.closest('[data-action]'); if(!b) return;
      const link=parsedLinks().find(x=>x.id===b.dataset.id); if(!link) return;
      const a=b.dataset.action;
      if(a==='favorite'){ state.favorites.has(link.id) ? state.favorites.delete(link.id) : state.favorites.add(link.id); saveFavorites(); renderServersOnly(); }
      else if(a==='copy-link') copyText(preparedContent(link.raw).content);
      else if(a==='qr-link') openQrModal(link);
      else if(a==='download-wg'){ const w=getWireGuardConfig(link.raw); if(w) downloadText(w.content,w.fileName); }
    });
    bindFlagImages();
  }
  function bindChart(){ document.querySelectorAll('[data-range]').forEach(b => b.addEventListener('click', () => { state.timeRange=b.dataset.range; fetchUsage(); })); }

  let qrModalInstance=null;
  function openQrModal(link){
    state.modal={...link}; state.qrMode='config';
    renderModal();
    qrModalInstance = qrModalInstance || new bootstrap.Modal(document.getElementById('qrModal'));
    qrModalInstance.show();
  }
  function renderModal(){
    if(!state.modal) return;
    const m=state.modal, prepared=preparedContent(m.raw), isWG=prepared.wireguard, qrValue=(isWG && state.qrMode==='config') ? prepared.content : m.raw;
    document.getElementById('qrModalTitle').textContent=t('qrTitle');
    let qr='';
    try { if(qrValue.length>2900) throw new Error('long'); const q=qrcode(0,'L'); q.addData(qrValue,'Byte'); q.make(); qr=q.createSvgTag({cellSize:4,margin:4,scalable:true}); }
    catch(e){ qr=`<div class="text-danger text-center fw-semibold p-3">${t('qrTooLong')}</div>`; }
    document.getElementById('qrBoxContent').innerHTML=qr;
    document.getElementById('qrModalProto').textContent=protocolBadge(m.protocol);
    document.getElementById('qrModalName').textContent=m.name;
    const tabsEl=document.getElementById('qrModeTabs');
    if(isWG){ tabsEl.classList.remove('d-none'); tabsEl.innerHTML=`<li class="nav-item"><button class="nav-link ${state.qrMode==='config'?'active':''}" data-qrmode="config">${t('configFormat')}</button></li><li class="nav-item"><button class="nav-link ${state.qrMode==='uri'?'active':''}" data-qrmode="uri">${t('uriFormat')}</button></li>`; }
    else { tabsEl.classList.add('d-none'); tabsEl.innerHTML=''; }
    document.getElementById('modal-copy').textContent=t(m.protocol==='unknown'?'copy':'copyConfig');
    const b64Btn=document.getElementById('modal-base64'); b64Btn.classList.toggle('d-none', m.protocol==='unknown'); b64Btn.textContent=t('copyBase64');
    const dlBtn=document.getElementById('modal-download'); dlBtn.classList.toggle('d-none', !isWG); dlBtn.textContent=t('downloadWireGuard');
    document.getElementById('modal-copy').onclick=() => copyText(prepared.content);
    b64Btn.onclick=() => copyText(b64Encode(prepared.content));
    dlBtn.onclick=() => downloadText(prepared.content, prepared.fileName||'wireguard.conf');
    tabsEl.querySelectorAll('[data-qrmode]').forEach(b => b.addEventListener('click', () => { state.qrMode=b.dataset.qrmode; renderModal(); }));
  }

  function setActiveNav(section){
    if(!['dashboard','servers','apps','profile'].includes(section)) section='dashboard';
    state.activeSection=section;
    document.querySelectorAll('.bottom-nav .nav-link').forEach(l => l.classList.toggle('active', l.dataset.section===section));
  }
  function bindNav(){
    document.querySelectorAll('.bottom-nav .nav-link').forEach(l => l.addEventListener('click', () => {
      const section=l.dataset.section||'dashboard'; setActiveNav(section);
      if(section==='servers'){ const body=document.getElementById('serversBody'); if(body && !body.classList.contains('show')) new bootstrap.Collapse(body,{toggle:true}); }
    }));
  }
  function bind(){
    bindToolbar(); bindServers(); bindChart(); bindNav();
    document.getElementById('retry-btn')?.addEventListener('click', fetchInfo);
    document.getElementById('copy-sub')?.addEventListener('click', () => copyText(subscriptionUrl()));
    document.getElementById('qr-sub')?.addEventListener('click', () => openQrModal({id:'sub',raw:subscriptionUrl(),protocol:'unknown',name:t('copySubscription')}));
    document.getElementById('copy-all')?.addEventListener('click', () => copyText(parsedLinks().map(x=>x.raw).join('\n'), t('copiedAll')));
    document.getElementById('support-empty')?.addEventListener('click', () => toast(t('supportUnavailable'),'error'));
  }

  window.addEventListener('hashchange', () => setActiveNav(location.hash.slice(1)||'dashboard'));
  render(); fetchInfo(); fetchUsage(); fetchApps();
  if(!isPreview){ setInterval(() => { if(document.visibilityState==='visible') fetchInfo(); }, CONFIG.refreshIntervalMs); window.addEventListener('focus', fetchInfo); }
})();
</script>
</body>
</html>
